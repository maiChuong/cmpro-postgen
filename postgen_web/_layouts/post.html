<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: "PostGen Web" }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <style>
      body {
        background: #f7f9fb;
        font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
        color: #222;
        margin: 0;
        padding: 0;
      }
      .news-article {
        max-width: 700px;
        margin: 3rem auto 2rem auto;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 2px 16px rgba(0,0,0,0.07);
        padding: 2.5rem 2.2rem 2rem 2.2rem;
      }
      @media screen and (min-width: 701px) {
        .news-article {
          max-width: none;
        }
      }
      .news-article h1 {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 0.4em;
        text-align: center;
      }
      .news-meta {
        color: #888;
        font-size: 1.05rem;
        margin-bottom: 2rem;
        text-align: center;
      }
      .news-content {
        font-size: 1.18rem;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
     {% include nav.html %}
    <div class="news-article">
      <h1>{{ page.title }}</h1>
      <div class="news-meta">{{ page.date | date: "%B %d, %Y" }}</div>
      <div class="news-content">
        {{ content }}
      </div>
    </div>
  </body>
</html>
