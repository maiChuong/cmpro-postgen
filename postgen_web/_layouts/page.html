<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>{{ page.title }}</title>
    <style>
      body {
        background: #f7f9fb;
        font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
        color: #222;
        margin: 0;
        padding: 0;
      }
      main {
        max-width: 800px;
        margin: 3rem auto;
        padding: 2rem;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 2px 16px rgba(0,0,0,0.07);
      }
      h1 {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 1rem;
      }
      </style>
  </head>
  <body>
    <main>
      <h1>{{ page.title }}</h1>
      {{ content }}
    </main>
  </body>
</html>
