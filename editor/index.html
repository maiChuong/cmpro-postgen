<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Long-form Editor - PostGen</title>
        <style>
    body {
    background: #f7f9fb;
    font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
    color: #222;
    margin: 0;
    padding: 0;
    }
    main {
    max-width: 1200px;
    margin: 3rem auto;
    padding: 2rem;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.07);
    }
    @media screen and (min-width: 801px) {
    main {
        max-width: none;
    }
    }
    h1 {
    font-size: 2.5rem;
    font-weight: 700;
    margin-bottom: 1rem;
    }
    .header-top {
        padding: 1vw 15vw;
    }
      </style>
    
    <!-- Link to your site's main stylesheet for consistent styling -->
    <link rel="stylesheet" href="/cmpro-postgen/assets/css/style.css">

    <!-- Load Editor.js and its tools in the head to ensure they are available for the integration script -->
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/editorjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/header@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/list@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/paragraph@latest"></script>

</head>
<body>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <ul class="nav-menu">
            <li><a href="/cmpro-postgen/">Home</a></li>
            <li><a href="/cmpro-postgen/about">About</a></li>
            <li><a href="/cmpro-postgen/news">News</a></li>
        </ul>
    </nav>

    <!-- The 'content' variable will inject the HTML from editor.md here -->
    <div class="header-top">
    <h1>Long-Form Post Editor</h1>
    <img src="/cmpro-postgen/assets/img/Logo.png" alt="PostGen Logo" class="logo">
</div>
<div class="container">
  <!-- The long-form editor will be initialized here -->
  <div id="longPostDisplay"
       class="content-display">
    <!-- This div will be populated by Editor.js -->
  </div>
</div>

<script>
  // Embed the initial data from Jekyll front matter into a JS variable.
  const initialPageData = [{"type":"paragraph","data":{"text":"Welcome to your long-form editor! Generate content on the main page and click 'Editor' to send it here."}},{"type":"header","data":{"text":"Getting Started","level":2}}];
</script>
    <!-- Load the script that initializes the editor after the content is on the page -->
    <script src="/cmpro-postgen/assets/js/editor-integration.js"></script>
</body>
</html>
